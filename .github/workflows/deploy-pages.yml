# 文件说明：测试主分支，并把正式古风气韵评测的白名单文件部署到 GitHub Pages。
name: 测试并部署 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装项目依赖
        run: npm ci

      - name: 安装浏览器测试环境
        run: npx playwright install --with-deps chromium

      - name: 运行完整测试
        run: npm test

      - name: 生成正式页面发布包
        run: npm run build:pages

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传正式页面发布包
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
